<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Results - {{ state }}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f0eb;
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
            font-size: 14px;
            color: #333;
        }

        a { color: #c8622a; text-decoration: none; font-size: 13px; }

        h1 { font-size: 22px; margin: 10px 0 4px; }

        hr { border: none; border-top: 1px solid #ccc; margin: 14px 0 20px; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-bottom: 24px;
        }

        table th, table td {
            border: 1px solid #ddd;
            padding: 10px 14px;
            text-align: left;
        }

        table th {
            background-color: #f0ece6;
            font-weight: bold;
            width: 25%;
        }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .chart-box {
            background: white;
            border: 1px solid #ddd;
            padding: 14px;
        }

        .chart-box p {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        canvas { max-height: 220px; }

        .summary {
            background: white;
            padding: 14px 18px;
            font-size: 14px;
            line-height: 1.7;
            color: #0e0e0e;
        }
    </style>
</head>
<body>

    <a href="/">← Back</a>

    <h1>{{ metric }} for {{ state }}</h1>
    <hr>

    <table>
        <tr>
            <th>Avg / Month</th>
            <th>Minimum</th>
            <th>Total</th>
        </tr>
        <tr>
            <td>{{ stats.average }} thousand MWh</td>
            <td>{{ stats.min }} thousand MWh</td>
            <td>{{ stats.total }} thousand MWh</td>
        </tr>
    </table>

    <div class="charts-row">
        <div class="chart-box">
            <p>Generation Over Time</p>
            <canvas id="lineChart"></canvas>
        </div>
        <div class="chart-box">
            <p>Average Annual Generation</p>
            <canvas id="barChart"></canvas>
        </div>
    </div>

    <div class="summary">
        <b>What does this mean?</b>
        {{ stats.summary }}
    </div>

</body>
<script>
    const chartData = {{ chart_data | safe }};

    Chart.defaults.font = { family: "Arial, sans-serif", size: 11 };
    Chart.defaults.color = "#888";

    new Chart(document.getElementById("lineChart"), {
        type: "line",
        data: {
            labels: chartData.line.labels,
            datasets: [{
                data: chartData.line.values,
                backgroundColor: "rgba(200,98,42,0.08)",
                pointRadius: 2,
                fill: true,
                tension: 0.3,
            }]
        },
        options: {
            responsive: true,
            animation: false,
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            scales: {
                x: { ticks: { maxTicksLimit: 7 } },
                y: {}
            }
        }
    });

    new Chart(document.getElementById("barChart"), {
        type: "bar",
        data: {
            labels: chartData.bar.labels,
            datasets: [{
                data: chartData.bar.values,
                backgroundColor: "rgba(74,124,111,0.7)",
            }]
        },
        options: {
            responsive: true,
            animation: false,
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            scales: { x: {}, y: {} }
        }
    });
</script>
</html>
