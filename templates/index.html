<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Energy Dashboard</title>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: #f5f0eb;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 6px;
        }

        hr {
            border: none;
            border-top: 1px solid #ccc;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #444;
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #29ddf9;
            border-radius: 4px;
            background: rgb(245, 199, 199);
            margin-bottom: 20px;
        }

        .year-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .year-row .field label {
            margin-bottom: 6px;
        }

        .year-row .field select {
            width: 100%;
        }

        .error {
            color: #f90e0e;
            font-size: 13px;
            margin-top: -14px;
            margin-bottom: 16px;
            display: none;
        }

        button {
            padding: 10px 24px;
            font-size: 15px;
            background-color: #f41919;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>U.S. Energy Dashboard</h1>
    <hr>

    <form action="/dashboard" method="POST" onsubmit="return validateYears()">

        <label for="state">State</label>
        <select name="state" id="state">
            <option value="CA">California</option>
            <option value="TX">Texas</option>
            <option value="NY">New York</option>
            <option value="FL">Florida</option>
            <option value="WA">Washington</option>
            <option value="CO">Colorado</option>
            <option value="AZ">Arizona</option>
            <option value="IL">Illinois</option>
            <option value="PA">Pennsylvania</option>
            <option value="OH">Ohio</option>
        </select>

        <label for="metric">Energy Source</label>
        <select name="metric" id="metric">
            <option value="SUN">Solar</option>
            <option value="WND">Wind</option>
            <option value="NG">Natural Gas</option>
            <option value="COL">Coal</option>
            <option value="NUC">Nuclear</option>
        </select>

        <div class="year-row">
            <div class="field">
                <label for="start_year">Start Year</label>
                <select name="start_year" id="start_year">
                    <option value="2001">2001</option>
                    <option value="2002">2002</option>
                    <option value="2003">2003</option>
                    <option value="2004">2004</option>
                    <option value="2005">2005</option>
                    <option value="2006">2006</option>
                    <option value="2007">2007</option>
                    <option value="2008">2008</option>
                    <option value="2009">2009</option>
                    <option value="2010">2010</option>
                    <option value="2011">2011</option>
                    <option value="2012">2012</option>
                    <option value="2013">2013</option>
                    <option value="2014">2014</option>
                    <option value="2015">2015</option>
                    <option value="2016">2016</option>
                    <option value="2017">2017</option>
                    <option value="2018">2018</option>
                    <option value="2019">2019</option>
                    <option value="2020">2020</option>
                    <option value="2021">2021</option>
                    <option value="2022">2022</option>
                    <option value="2023" selected>2023</option>
                </select>
            </div>
            <div class="field">
                <label for="end_year">End Year</label>
                <select name="end_year" id="end_year">
                    <option value="2001">2001</option>
                    <option value="2002">2002</option>
                    <option value="2003">2003</option>
                    <option value="2004">2004</option>
                    <option value="2005">2005</option>
                    <option value="2006">2006</option>
                    <option value="2007">2007</option>
                    <option value="2008">2008</option>
                    <option value="2009">2009</option>
                    <option value="2010">2010</option>
                    <option value="2011">2011</option>
                    <option value="2012">2012</option>
                    <option value="2013">2013</option>
                    <option value="2014">2014</option>
                    <option value="2015">2015</option>
                    <option value="2016">2016</option>
                    <option value="2017">2017</option>
                    <option value="2018">2018</option>
                    <option value="2019">2019</option>
                    <option value="2020">2020</option>
                    <option value="2021">2021</option>
                    <option value="2022">2022</option>
                    <option value="2023">2023</option>
                    <option value="2024" selected>2024</option>
                </select>
            </div>
        </div>
        <p class="error" id="year-error">End year must be greater than or equal to start year.</p>

        <button type="submit">Submit</button>

    </form>

    <script>
        function validateYears() {
            const start = parseInt(document.getElementById("start_year").value);
            const end = parseInt(document.getElementById("end_year").value);
            const error = document.getElementById("year-error");
            if (end < start) {
                error.style.display = "block";
                return false;
            }
            error.style.display = "none";
            return true;
        }
    </script>
</body>
</html>
